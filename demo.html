<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/demo.css">
        <script defer src="./scripts/demo.js"></script>
        <title>Demo</title>
    </head>
    <body>
<nav class="topnav">
    <div class="container">
      <a href="#intro">Home</a>
      <a href="#forms">Forms</a>
      <a href="#cards">Cards</a>
      <a href="#table">Table</a>
    </div>
  </nav>

  <main class="container">
    <section id="intro" class="section">
      <h1>Simple demo page</h1>
      <p>This page shows a few common UI elements in a very plain style.</p>
      <p>It includes buttons, form fields, links, images, cards, a table, a banner, a modal, and a sticky notice.</p>
      <div class="button-row">
        <button class="primary" id="openModal">Primary</button>
        <button>Secondary</button>
        <button disabled>Disabled</button>
      </div>
    </section>

    <section id="forms" class="section">
      <h2>Forms</h2>
      <div class="form-row">
        <label>
          Name
          <input type="text" placeholder="Your name" />
        </label>
        <label>
          Email
          <input type="email" placeholder="you@example.com" />
        </label>
        <label>
          Dropdown
          <select>
            <option>One</option>
            <option>Two</option>
            <option>Three</option>
          </select>
        </label>
        <label><input type="checkbox" /> Check me</label>
        <div class="error">Example error message.</div>
      </div>
      <p style="margin-top:12px;">Here is a <a href="#cards">link to cards</a> and a <a href="#table">link to the table</a>.</p>
    </section>

  </div>

    </body>
</html>
